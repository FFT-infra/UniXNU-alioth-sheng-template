name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      core_ref:
        description: UniXNU core branch or commit
        type: string
        default: main
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.core_ref }}
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: Pin the FreeBSD Wi-Fi dependency to its locked commit
        # Ath12kWifi clones freebsd-src at the lock's branch head while the lock records a
        # commit; releng/15.1 moved on and the fetch refuses the result. Clone the same
        # sparse, blob-filtered tree the script expects, then select the locked commit.
        run: |
          python3 - <<'PYSTEP'
          import json, subprocess, sys
          from pathlib import Path
          lock = json.loads(Path("device/drivers/Ath12kWifi/tools/source-lock.json").read_text())
          source = lock["freebsd"]
          target = Path("device/drivers/Ath12kWifi/deps/freebsd")

          def git(*args):
              return subprocess.run(["git", "-C", str(target), *args], check=True,
                                    capture_output=True, text=True).stdout.strip()

          if (target / ".git").exists():
              if git("rev-parse", "HEAD") != source["commit"]:
                  raise SystemExit("freebsd checkout is not at the locked commit; remove it to refetch")
              print("freebsd already at the locked commit")
              sys.exit(0)
          target.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(["git", "clone", "-q", "--depth", "1", "--branch", source["ref"],
                          "--filter=blob:none", "--sparse", source["url"], str(target)], check=True)
          subprocess.run(["git", "-C", str(target), "fetch", "-q", "--depth", "1",
                          "--filter=blob:none", "origin", source["commit"]], check=True)
          subprocess.run(["git", "-C", str(target), "checkout", "-q", "FETCH_HEAD"], check=True)
          head = git("rev-parse", "HEAD")
          if head != source["commit"]:
              raise SystemExit(f"freebsd checkout at {head}, expected {source['commit']}")
          print("freebsd pinned to", head)
          PYSTEP
      - name: Extract proprietary files
        run: python3 device/scripts/extract-files.py
      - name: Fetch the Wi-Fi locked sources
        run: python3 device/drivers/Ath12kWifi/tools/fetch-sources.py
      - name: Prepare root policies
        if: inputs.os == '27'
        working-directory: UniXNU
        run: |
          ./unixnu defconfig sheng_ipados27_defconfig -D ../device --os 27
          python3 - <<'PYSTEP'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser, prepare
          from unixnu.config import Context
          from unixnu.ipsw import Ipsw
          from unixnu.userdata import disk_blocks, image_size
          ctx = Context(parser().parse_args(['build', 'kernel', '-D', '../device', '--os', '27']))
          prepare(ctx, ['kernel'])
          source = Ipsw(ctx)
          runtime = ctx.work / 'runtime'
          runtime.mkdir(parents=True, exist_ok=True)
          policies = ctx.device / 'scripts/policies' / ctx.work.parent.name
          for window in ctx.board['userdata']['windows']:
              name = window['name']
              image = source.disk_image(window['component'])
              raw = runtime / (name + '.raw')
              size = image_size(image)
              with raw.open('wb') as output:
                  for block in disk_blocks(image, size):
                      output.write(block)
              volume = ctx.board['root'][name.lower() + '_volume_uuid']
              subprocess.run([sys.executable, 'scripts/make-root-policies.py',
                              '--tree', str(ctx.tree), '--output', str(policies),
                              '--window', '{}={}:{}'.format(name, raw, volume)], check=True)
              raw.unlink(missing_ok=True)
          PYSTEP
      - name: Extend the Metal bridge patch for iOS
        if: inputs.os == '27'
        run: |
          python3 - <<'PYSTEP'
          import glob
          from pathlib import Path
          found = glob.glob('UniXNU/out/sheng/*/*/tree/drivers/AdrenoMetal/bridge/patches/0064-*.patch')
          if len(found) != 1:
              raise SystemExit(f'expected one 0064 patch under the tree, found {found}')
          extra = Path('device/.github/patches/ios27-read-pages.diff').read_text()
          target = Path(found[0])
          text = target.read_text()
          if extra.strip() in text:
              print('0064 already carries the iOS read_pages guard')
          else:
              target.write_text(text.rstrip('\n') + '\n' + extra)
              print('extended', target)
          PYSTEP
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 1
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: Upload prelink inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prelink-inputs
          retention-days: 1
          if-no-files-found: ignore
          path: |
            UniXNU/out/ipsw/24A446/kernelcache.decompressed
            UniXNU/out/sheng/*/*/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
      - name: Build root storage
        if: inputs.os == '27'
        working-directory: UniXNU
        run: |
          python3 - <<'PYSTEP'
          import subprocess, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['build', 'userdata', '-D', '../device', '--os', '27']))
          objects = []
          for window in ctx.board['userdata']['windows']:
              name = window['name']
              objects += ['--object', f'{name}.vroot={ctx.tree}/build/verified-root-{name}/hashes.bin']
          subprocess.run(['./unixnu', 'build', 'userdata', '--os', '27', *objects], check=True)
          PYSTEP
      - name: Compress the userdata root image
        if: inputs.os == '27'
        run: |
          image=$(ls UniXNU/out/sheng/ipados-27.0.1-24A446/*/userdata/userdata-root.img)
          zstd -T0 -3 --sparse "$image" -o "${image}.zst"
          ls -lh "$image" "${image}.zst"
      - name: Failure logs
        if: failure()
        run: |
          for f in UniXNU/out/sheng/*/*/logs/*.log UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            tail -n 200 "$f"
          done
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.os }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            UniXNU/out/sheng/*/*/logs/*.log
            UniXNU/out/sheng/*/*/tree/build/adreno-metal-bridge/build-*.log
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/userdata/userdata-root.json
            UniXNU/out/sheng/*/*/userdata/userdata-root.img.zst
